<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cineteca</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><img src="icon.svg" alt=""><span>Cineteca</span></a>
  <nav class="nav">
    <a href="#/" data-route="home">Home</a>
    <a href="#/discover" data-route="discover">Discover</a>
    <a href="#/library" data-route="library">Library</a>
    <a href="#/settings" data-route="settings">Devices<span class="long"> &amp; Settings</span></a>
  </nav>
  <div class="speed" id="speed"></div>
</header>
<main id="view"></main>
<dialog id="confirm">
  <h3 id="confirm-title"></h3>
  <p id="confirm-text" class="muted"></p>
  <div class="row">
    <button class="btn" value="cancel" id="confirm-cancel">Cancel</button>
    <button class="btn danger" value="ok" id="confirm-ok">Delete</button>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
